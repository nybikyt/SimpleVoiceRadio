name: nightly

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: SimpleVoiceRadio-nightly
          path: build/libs/*.jar

  latest-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Find latest stable Paper API
        run: |
          version=$(curl -fsSL https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml | grep -oE '[0-9][0-9.]*\.build\.[0-9]+-stable' | sort -V | tail -n 1)
          echo "PAPER_API=$version" >> "$GITHUB_ENV"
      - run: chmod +x gradlew
      - run: ./gradlew compileJava -PpaperApi="$PAPER_API" -PjavaRelease=25
