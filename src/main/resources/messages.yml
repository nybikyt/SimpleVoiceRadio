# ===================================================== #
#             SimpleVoiceRadio Messages                 #
# Help/Support - https://discord.com/invite/WESPMeKUDe  #
# ===================================================== #

# All messages support MiniMessage and legacy color codes
# Words in {braces} are filled in by the plugin, keep them as they are

no-permission: "<#d64933>No permission."
unknown-subcommand: "<#d64933>Unknown subcommand."
players-only: "<#d64933>Players only."

reload:
  done: "<#f57542>Config has been reloaded!"

give:
  player-not-found: "<#d64933>Player not found: {player}"
  done: "<#f57542>Radio has been given to {count} player(s)!"

view-craft:
  # Title of the window opened by /simple_voice_radio view_craft
  title: "Radio craft recipe"

play-audio:
  voice-unavailable: "<#d64933>Voice chat is not available."
  already-streaming: "<#d64933>Already streaming."
  nothing-playing: "<#d64933>Nothing is playing."
  stopped: "<#f57542>Playback stopped."
  invalid-path: "<#d64933>Invalid file path."
  file-not-found: "<#d64933>File not found: <#778da9>{file}"
  invalid-url: "<#d64933>Invalid URL: must start with http:// or https://"
  failed: "<#d64933>Playback failed: <#778da9>{error}"
  started: "<#f57542>Streaming audio: <#778da9>{source}"
  # Added to the message above when a frequency or loop is set
  started-frequency: " <#778da9>[freq {frequency}]"
  started-loop: " <#778da9>[loop]"
